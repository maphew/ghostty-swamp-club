name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck install.sh
        run: shellcheck -S style install.sh

      - name: theme file is well-formed
        run: |
          python3 - <<'PY'
          import re
          keys, palette = {}, {}
          for line in open("themes/swamp-club"):
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              k, _, v = (p.strip() for p in line.partition("="))
              assert _ == "=", f"bad line: {line!r}"
              if k == "palette":
                  i, _, hexv = v.partition("=")
                  palette[int(i)] = hexv
              else:
                  keys[k] = v
          assert sorted(palette) == list(range(16)), f"palette slots: {sorted(palette)}"
          for k in ("background", "foreground", "cursor-color", "cursor-text",
                    "selection-background", "selection-foreground"):
              assert k in keys, f"missing {k}"
          for v in list(palette.values()) + list(keys.values()):
              assert re.fullmatch(r"#[0-9a-f]{6}", v), f"not #rrggbb: {v}"
          # A theme file can set any option; keep this one to colors only.
          allowed = {"background", "foreground", "cursor-color", "cursor-text",
                     "selection-background", "selection-foreground", "split-divider-color"}
          assert set(keys) <= allowed, f"unexpected keys: {set(keys) - allowed}"
          print(f"ok: 16 palette slots, {len(keys)} color options, all hex")
          PY

      - name: install.sh replaces an existing theme line and keeps the rest
        run: |
          set -euo pipefail
          export XDG_CONFIG_HOME="$(mktemp -d)"
          mkdir -p "$XDG_CONFIG_HOME/ghostty"
          printf 'font-family = Iosevka\ntheme = Dracula\ncopy-on-select = clipboard\n' > "$XDG_CONFIG_HOME/ghostty/config"
          ./install.sh
          cmp themes/swamp-club "$XDG_CONFIG_HOME/ghostty/themes/swamp-club"
          test "$(grep -c '^theme' "$XDG_CONFIG_HOME/ghostty/config")" = 1
          grep -qx 'theme = swamp-club' "$XDG_CONFIG_HOME/ghostty/config"
          grep -qx 'font-family = Iosevka' "$XDG_CONFIG_HOME/ghostty/config"
          grep -qx 'copy-on-select = clipboard' "$XDG_CONFIG_HOME/ghostty/config"
          echo "ok"

      - name: install.sh edits a distro-named config.ghostty instead of making config
        run: |
          set -euo pipefail
          export XDG_CONFIG_HOME="$(mktemp -d)"
          mkdir -p "$XDG_CONFIG_HOME/ghostty"
          printf 'theme = Catppuccin Mocha\nwindow-padding-x = 8\n' > "$XDG_CONFIG_HOME/ghostty/config.ghostty"
          ./install.sh
          grep -qx 'theme = swamp-club' "$XDG_CONFIG_HOME/ghostty/config.ghostty"
          grep -qx 'window-padding-x = 8' "$XDG_CONFIG_HOME/ghostty/config.ghostty"
          test ! -e "$XDG_CONFIG_HOME/ghostty/config" || test ! -s "$XDG_CONFIG_HOME/ghostty/config"
          echo "ok"

      - name: install.sh creates config.ghostty when no config exists
        run: |
          set -euo pipefail
          export XDG_CONFIG_HOME="$(mktemp -d)"
          ./install.sh
          grep -qx 'theme = swamp-club' "$XDG_CONFIG_HOME/ghostty/config.ghostty"
          test ! -e "$XDG_CONFIG_HOME/ghostty/config"
          echo "ok"

      - name: install.sh edits the winning file when both configs exist
        run: |
          set -euo pipefail
          export XDG_CONFIG_HOME="$(mktemp -d)"
          mkdir -p "$XDG_CONFIG_HOME/ghostty"
          printf 'font-size = 13\n' > "$XDG_CONFIG_HOME/ghostty/config"
          printf 'font-size = 11\n' > "$XDG_CONFIG_HOME/ghostty/config.ghostty"
          out="$(./install.sh)"
          grep -qx 'theme = swamp-club' "$XDG_CONFIG_HOME/ghostty/config.ghostty"
          ! grep -q '^theme' "$XDG_CONFIG_HOME/ghostty/config"
          printf '%s\n' "$out" | grep -q 'also reads .*/ghostty/config;'
          echo "ok"

      - name: --config and --theme-only and --dry-run are respected
        run: |
          set -euo pipefail
          export XDG_CONFIG_HOME="$(mktemp -d)"
          mkdir -p "$XDG_CONFIG_HOME/ghostty"
          printf 'theme = Dracula\n' > "$XDG_CONFIG_HOME/ghostty/mine"
          ./install.sh --config "$XDG_CONFIG_HOME/ghostty/mine"
          grep -qx 'theme = swamp-club' "$XDG_CONFIG_HOME/ghostty/mine"
          ! grep -q '^theme' "$XDG_CONFIG_HOME/ghostty/config.ghostty" 2>/dev/null || true
          printf 'theme = Dracula\n' > "$XDG_CONFIG_HOME/ghostty/untouched"
          ./install.sh --theme-only --config "$XDG_CONFIG_HOME/ghostty/untouched"
          grep -qx 'theme = Dracula' "$XDG_CONFIG_HOME/ghostty/untouched"
          cp "$XDG_CONFIG_HOME/ghostty/untouched" /tmp/before
          ./install.sh --dry-run --config "$XDG_CONFIG_HOME/ghostty/untouched"
          cmp /tmp/before "$XDG_CONFIG_HOME/ghostty/untouched"
          echo "ok"
